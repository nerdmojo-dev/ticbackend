<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="/js/util.js" defer></script>

    <script src="/js/admin-home.js" defer></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center overflow-hidden">

    <!-- Background Blobs -->
    <div class="absolute w-96 h-96 bg-cyan-500 rounded-full blur-3xl opacity-30 top-10 left-10"></div>
    <div class="absolute w-96 h-96 bg-purple-600 rounded-full blur-3xl opacity-30 bottom-10 right-10"></div>

    <!-- Glass Card -->
    <div class="relative w-full max-w-[75%] mx-4">

        <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl shadow-2xl p-10">


            <div class="flex flex-col sm:flex-row justify-between items-center mb-8 
            backdrop-blur-xl bg-white/10 border border-white/20 
            rounded-2xl p-5 shadow-lg gap-4">

                <!-- Title -->
                <div>
                    <h1 class="text-3xl font-bold text-white">
                        Dashboard
                    </h1>
                    <p class="text-gray-300 text-sm mt-1">
                        Manage your system activities
                    </p>
                </div>


                <!-- Actions -->
                <div class="flex items-center gap-3">
                    <button id="userListBtn" type="button" class="flex items-center gap-2 px-5 py-3 rounded-xl
           bg-blue-600/90 hover:bg-blue-500
           text-white font-medium
           transition-all duration-300
           shadow-lg hover:shadow-blue-500/30
           active:scale-95">

                        <!-- Users Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a4 4 0 00-4-4h-1m-4 6H6v-2a4 4 0 014-4h4a4 4 0 014 4v2zm-6-10a4 4 0 100-8 4 4 0 000 8zm6 2a3 3 0 100-6 3 3 0 000 6z" />
                        </svg>

                        User List
                    </button>

                    <!-- Update Employees -->
                    <button id="filterBtn" type="button" class="flex items-center gap-2 px-5 py-3 rounded-xl 
                   bg-amber-600/90 hover:bg-amber-500 
                   text-white font-medium
                   transition-all duration-300
                   shadow-lg hover:shadow-amber-500/30
                   active:scale-95">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>

                        Update Employees
                    </button>


                    <!-- Logout -->
                    <button id="logoutBtn" type="button" class="flex items-center gap-2 px-5 py-3 rounded-xl
                   bg-red-600/90 hover:bg-red-500
                   text-white font-medium
                   transition-all duration-300
                   shadow-lg hover:shadow-red-500/30
                   active:scale-95" onclick="logout()">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>

                        Logout
                    </button>

                </div>

            </div>

            <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl shadow-2xl p-8">




                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

                    <div>
                        <label class="block text-gray-300 text-sm mb-2">
                            Start Date
                        </label>

                        <input id="startDate" type="date"
                            class="w-full rounded-lg bg-white/10 border border-white/20 text-white px-4 py-2 outline-none focus:ring-2 focus:ring-cyan-400">
                    </div>

                    <div>
                        <label class="block text-gray-300 text-sm mb-2">
                            End Date
                        </label>

                        <input id="endDate" type="date"
                            class="w-full rounded-lg bg-white/10 border border-white/20 text-white px-4 py-2 outline-none focus:ring-2 focus:ring-cyan-400">
                    </div>

                    <div class="flex items-end">
                        <button id="filterBtn" onclick="resetAndLoad()"
                            class="w-full px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-white">
                            Apply Filter
                        </button>
                    </div>

                    <div class="flex items-end">
                        <button id="exportBtn"
                            class="w-full px-4 py-2 rounded-lg bg-green-600 hover:bg-green-500 text-white">
                            Export to Excel
                        </button>
                    </div>

                </div>

                <div class="overflow-auto rounded-xl h-[400px]">

                    <table class="min-w-full text-white">
                        <thead class="bg-white/10">
                            <tr>
                                <th class="px-6 py-4 text-left">#</th>

                                <th class="px-6 py-4 text-left">User</th>
                                <th class="px-6 py-4 text-left">Title</th>
                                <th class="px-6 py-4 text-left">Description</th>
                                <th class="px-6 py-4 text-left">Date</th>
                                <th class="px-6 py-4 text-left">Task Status</th>
                            </tr>
                        </thead>

                        <tbody id="tableBody">
                            <td colspan="6"
                                class="w-full py-3 col-span-full text-center text-gray-300 bg-white/5 rounded-lg">
                                Loading...
                            </td>
                        </tbody>

                    </table>

                </div>

                <div class="flex justify-between items-center mt-6">

                    <button id="prevBtn"
                        class="px-5 py-2  bg-red-500 disabled:bg-slate-700 rounded-lg text-white disabled:opacity-40">
                        Previous
                    </button>

                    <span id="pageNo" class="text-white">
                        Page 1
                    </span>

                    <button id="nextBtn"
                        class="px-5 py-2 bg-cyan-500 rounded-lg text-white disabled:opacity-40 disabled:bg-slate-700">
                        Next
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
