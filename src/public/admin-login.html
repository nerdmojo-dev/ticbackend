<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="/js/admin-login.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center overflow-hidden">

    <!-- Background Blobs -->
    <div class="absolute w-96 h-96 bg-cyan-500 rounded-full blur-3xl opacity-30 top-10 left-10"></div>
    <div class="absolute w-96 h-96 bg-purple-600 rounded-full blur-3xl opacity-30 bottom-10 right-10"></div>

    <!-- Glass Card -->
    <div class="relative w-full max-w-md mx-4">

        <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl shadow-2xl p-10">



            <h1 class="text-3xl font-bold text-center text-white mb-2">
                Admin Login
            </h1>

            <p class="text-center text-gray-300 mb-4">
                Sign in to continue
            </p>

            <div id="errorBuider"
                class="flex my-3 backdrop-blur-xl items-center justify-between text-red-600 w-full h-12 shadow rounded-md invisible">
                <div class="h-full w-1.5 bg-red-600 rounded-md"></div>
                <div class="flex ms-2 items-center py-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                        class="icon line">
                        <path
                            style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.95"
                            d="M11.95 16.5h.1" />
                        <path d="M3 12a9 9 0 0 1 9-9h0a9 9 0 0 1 9 9h0a9 9 0 0 1-9 9h0a9 9 0 0 1-9-9m9 0V7"
                            style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5" />
                    </svg>
                    <p id="errorText" class="text-sm  py-3 ml-2 max-w-[90%] text-center">Invalid user/password</p>
                </div>
                <button onclick="hideError()" type="button" aria-label="close" class="active:scale-90 transition-all mr-2">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>


            <form class="space-y-6">

                <div>
                    <label class="block text-gray-200 mb-2">
                        User ID
                    </label>

                    <input type="text" id="userId" placeholder="Enter your User ID"
                        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-cyan-400 transition">
                </div>

                <div>
                    <label class="block text-gray-200 mb-2">
                        Password
                    </label>

                    <input id="password" type="password" placeholder="Enter your password"
                        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-cyan-400 transition">
                </div>

                <button type="button" onclick="performLogin(event)"
                    class="w-full py-3 rounded-xl bg-cyan-500 text-white font-semibold transition duration-300 shadow-lg ">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>

</html>
