<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Upload</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .drop-zone.dragover {
            border-color: #4F46E5;
            background: #EEF2FF;
        }
    </style>
</head>

<body class="bg-gray-100 max-md:bg-white">

    <!-- Background Overlay -->
    <div class="fixed inset-0 bg-black/20 flex items-center justify-center">

        <!-- Modal -->
        <div class="bg-white md:mx-3 w-full max-w-[768px] rounded-xl shadow-2xl">

            <!-- Header -->
            <div class="flex justify-between items-start px-6 py-5 border-b">

                <div class="flex items-start gap-3">

                    <div
                        class="w-10 h-10 rounded-lg border flex items-center justify-center text-indigo-600 bg-indigo-50">

                        📄

                    </div>

                    <div>

                        <h2 class="text-xl font-semibold">
                            Upload CSV
                        </h2>

                        <p class="text-sm text-gray-500 mt-1">
                            Upload a CSV to quickly import users and attributes.
                        </p>

                    </div>

                </div>

            </div>

            <!-- Tabs -->
            <div class="flex px-6 mt-5 border-b md:justify-center">

                <button class="pb-3 px-2 border-b-2 border-indigo-600 text-indigo-600 font-medium">
                    New Upload
                </button>
            </div>

            <!-- Upload Area -->

            <div class="p-6">

                <div id="dropZone"
                    class="drop-zone border-2 border-dashed rounded-lg h-[320px] flex flex-col items-center justify-center transition">

                    <!-- Upload Icon -->

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-gray-400" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" />

                    </svg>

                    <p class="text-gray-500 mt-4">
                        Drag your file here to upload
                    </p>

                    <div class="flex gap-3 mt-6 md:flex-row flex-col">

                        <button id="browseBtn"
                            class="bg-yellow-400 hover:bg-yellow-500 px-5 py-2 rounded-md font-medium shadow">

                            Browse Files

                        </button>

                        <button id="downloadSampleBtn" class="border px-5 py-2 rounded-md hover:bg-gray-50">

                            Download Sample CSV

                        </button>

                    </div>

                    <input type="file" id="fileInput" accept=".csv,.xlsx" hidden>

                    <p id="fileName" class="mt-6 text-green-600 font-medium hidden">
                    </p>


                    <button id="importBtn" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hidden mt-2">
                        Import Users
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script>

        const browseBtn = document.getElementById("browseBtn");
        const fileInput = document.getElementById("fileInput");
        const dropZone = document.getElementById("dropZone");
        const fileName = document.getElementById("fileName");
        const downloadSampleBtn = document.getElementById("downloadSampleBtn");

        downloadSampleBtn.onclick = () => {
            window.location.href = "/sample.csv";
        }

        browseBtn.onclick = () => {
            fileInput.click();
        }

        fileInput.onchange = () => {

            if (fileInput.files.length > 0) {

                fileName.classList.remove("hidden");

                fileName.innerHTML =
                    "✔ " + fileInput.files[0].name;
                importBtn.classList.remove("hidden");

            }

        }
        const importBtn = document.getElementById("importBtn");

        dropZone.addEventListener("dragover", (e) => {

            e.preventDefault();

            dropZone.classList.add("dragover");

        });

        dropZone.addEventListener("dragleave", () => {

            dropZone.classList.remove("dragover");

        });

        dropZone.addEventListener("drop", (e) => {

            e.preventDefault();

            dropZone.classList.remove("dragover");

            fileInput.files = e.dataTransfer.files;

            if (fileInput.files.length > 0) {

                fileName.classList.remove("hidden");

                fileName.innerHTML =
                    "✔ " + fileInput.files[0].name;

                importBtn.classList.remove("hidden");

            }

        });

        

        importBtn.onclick = async () => {

            const file = document.getElementById("fileInput").files[0];

            if (!file) {
                alert("Please select a CSV.");
                return;
            }

            

            const formData = new FormData();

            formData.append("csvFile", file);

            const uploadResponse = await fetch(
                "/api/v1/auth/registerUser",
                {
                    method: "POST",
                    body: formData
                }
            );

            const uploadResult = await uploadResponse.json();

            alert("users imported successfully");

        };

    </script>

</body>

</html>
